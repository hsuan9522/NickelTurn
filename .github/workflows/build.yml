name: Build KoboRoot

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and NickelHook
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware package
        run: |
          docker run --rm \
            --volume="$GITHUB_WORKSPACE:/work" \
            --user="$(id -u):$(id -g)" \
            --workdir=/work \
            --env=HOME \
            --entrypoint=make \
            ghcr.io/pgaskin/nickeltc:1.0 \
            clean all koboroot NT_BUILD=full

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: KoboRoot.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Kobo installation package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/KoboRoot.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
